name: Push Gem

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  push:
    if: github.repository_owner == 'mensfeld'
    runs-on: ubuntu-latest
    environment: deployment

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@ba696adf55506673e48342a66e30f1f53cadeae0
        with:
          ruby-version: '4.0.2'
          bundler-cache: false

      - name: Bundle install
        run: bundle install --jobs 4 --retry 3

      - name: Compile C extension
        run: bundle exec rake compile

      - uses: rubygems/release-gem@e9a6361a0b14562539327c2a02373edc56dd3169
