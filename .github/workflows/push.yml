name: Push Gem

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  push:
    if: github.repository_owner == 'mensfeld'
    runs-on: ubuntu-latest
    environment: deployment

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@97b333846670e3cb692f29c0c5d42b71efc6bc93
        with:
          ruby-version: '4.0.2'
          bundler-cache: false

      - name: Bundle install
        run: bundle install --jobs 4 --retry 3

      - name: Compile C extension
        run: bundle exec rake compile

      - uses: rubygems/release-gem@176dbd32ac655c830b5e88c3f54c1a4af4481b23
